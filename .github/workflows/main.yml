name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, terraform-iac ]
    paths:
      - 'Backend/**'
      - 'terraform/**'
      - '.github/workflows/main.yml'
  push:
    branches: [ main, terraform-iac ]
    paths:
      - 'Backend/**'
      - 'terraform/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

# Ensure only one terraform apply runs at a time per branch
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  EB_APPLICATION_NAME: social-graph-app
  EB_ENVIRONMENT_NAME: Social-graph-app-env 
  AWS_REGION: us-east-2

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: main-aws
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      eb_bucket: ${{ steps.tf_out.outputs.eb_bucket }}
      eb_app: ${{ steps.tf_out.outputs.eb_app }}
      eb_env: ${{ steps.tf_out.outputs.eb_env }}
      cloudfront_backend_id: ${{ steps.tf_out.outputs.cloudfront_backend_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ]; then
            terraform init \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=socialgraph/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            terraform init
          fi
      - name: Terraform Plan (PR only)
        if: github.event_name == 'pull_request'
        env:
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
        run: terraform plan
      - name: Terraform Apply (main or terraform-iac branch)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/terraform-iac') && github.event_name != 'pull_request'
        env:
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
        run: terraform apply -auto-approve
      - name: Export Outputs
        id: tf_out
        run: |
          echo "eb_bucket=$(terraform output -raw eb_s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "eb_app=$(terraform output -raw elastic_beanstalk_app_name)" >> $GITHUB_OUTPUT
          echo "eb_env=$(terraform output -raw elastic_beanstalk_env_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_backend_id=$(terraform output -raw cloudfront_backend_id)" >> $GITHUB_OUTPUT
  # Backend Build and Test
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: ./Backend/servidor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/servidor/package-lock.json
          
      - name: Install backend dependencies
        run: npm ci
        
      - name: Lint backend
        run: npm run lint --if-present
        
      - name: Test backend with coverage
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
      
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/servidor/coverage
          retention-days: 30
          
      - name: Upload backend code
        uses: actions/upload-artifact@v4
        with:
          name: backend-code
          path: Backend/servidor
          retention-days: 1

  # Code Quality Analysis
  sonar:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js
            -Dsonar.exclusions=node_modules/**,dist/**,.output/**,coverage/**

  # Deploy to Elastic Beanstalk
  deploy:
    runs-on: ubuntu-latest
    needs: [infra, backend, sonar]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/terraform-iac') && github.event_name == 'push'
    environment: main-aws
    steps:
      - uses: actions/checkout@v4
      
      - name: Download backend code
        uses: actions/download-artifact@v4
        with:
          name: backend-code
          path: ./Backend/servidor
          
      - name: Setup deployment structure
        run: |
          # Create deployment directory
          mkdir -p deployment
          
          # Copy backend files
          cp -r Backend/servidor/* deployment/
          
          # Install production dependencies
          cd deployment
          npm install --omit=dev
  

      # Nota: La configuración del entorno (env vars, healthcheck, CORS) la gestiona Terraform
          
      - name: Create deployment package
        run: |
          cd deployment
          zip -r ../app.zip . -x ".git/*"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to Elastic Beanstalk
        run: |
          # Create application version
          VERSION_LABEL="v${{ github.run_number }}-${{ github.sha }}"

          # Upload application bundle to S3 first
          aws s3 cp app.zip s3://${{ needs.infra.outputs.eb_bucket }}/versions/$VERSION_LABEL.zip
          
          aws elasticbeanstalk create-application-version \
            --application-name ${{ needs.infra.outputs.eb_app }} \
            --version-label $VERSION_LABEL \
            --source-bundle S3Bucket="${{ needs.infra.outputs.eb_bucket }}",S3Key="versions/$VERSION_LABEL.zip" \
            --description "Deploy from GitHub Actions - ${{ github.sha }}"
          
          # Deploy to environment
          aws elasticbeanstalk update-environment \
            --application-name ${{ needs.infra.outputs.eb_app }} \
            --environment-name ${{ needs.infra.outputs.eb_env }} \
            --version-label $VERSION_LABEL

      - name: Verify deployment
        run: |
          # Get environment URL
          ENVIRONMENT_URL=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ needs.infra.outputs.eb_app }} \
            --environment-names ${{ needs.infra.outputs.eb_env }} \
            --query "Environments[0].CNAME" --output text)
            
          echo "🚀 Application deployed to: http://$ENVIRONMENT_URL"
          echo "🏥 Health check: http://$ENVIRONMENT_URL/health"
          echo ""
          echo "⏳ Esperando a que el ambiente esté listo (puede tomar 2-5 minutos)..."
          echo "💡 Verifica el estado en: https://console.aws.amazon.com/elasticbeanstalk"
          
          # Wait for environment to be ready (max 5 minutes)
          for i in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name ${{ needs.infra.outputs.eb_app }} \
              --environment-names ${{ needs.infra.outputs.eb_env }} \
              --query "Environments[0].Status" --output text)
            
            if [ "$STATUS" = "Ready" ]; then
              echo "✅ Environment is ready!"
              sleep 10  # Give it a few more seconds
              
              # Try health check
              if curl -f -s "http://$ENVIRONMENT_URL/health" > /dev/null; then
                echo "✅ Health check passed!"
                exit 0
              else
                echo "⚠️ Environment is ready but health check still failing. Check application logs."
                exit 0  # Don't fail the pipeline
              fi
            fi
            
            echo "Status: $STATUS - Waiting... ($i/30)"
            sleep 10
          done
          
          echo "⚠️ Timeout waiting for environment. Check AWS console for status."
          exit 0  # Don't fail the pipeline

      - name: Invalidate CloudFront backend cache (optional)
        if: ${{ needs.infra.outputs.cloudfront_backend_id != '' }}
        run: |
          echo "🔄 Invalidando caché de CloudFront backend..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.cloudfront_backend_id }} \
            --paths "/*"
          echo "✅ Invalidation solicitado"
