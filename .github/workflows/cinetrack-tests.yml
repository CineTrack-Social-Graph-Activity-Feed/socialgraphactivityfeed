name: CineTrack Testing Suite

on:
  push:
    branches: ['**']  # Se ejecuta en TODAS las branches
  pull_request:
    branches: ['main', 'develop']  # PRs hacia main y develop
  workflow_dispatch:  # Permite ejecución manual

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      
      - name: 🧪 Run Unit Tests with Coverage
        run: |
          python run_cinetrack_tests.py --unit --coverage
        continue-on-error: false
      
      - name: 📊 Generate Coverage Badge
        if: matrix.python-version == '3.10'
        run: |
          pip install coverage-badge
          coverage-badge -o coverage.svg -f
      
      - name: 📤 Upload Coverage Reports
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            reports/coverage_*/
            coverage.svg
          retention-days: 30
      
      - name: 📈 Upload Coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/coverage.xml
          flags: unittests
          name: codecov-cinetrack
          fail_ci_if_error: false
      
      - name: 💬 Comment PR with Results
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverageXml = fs.readFileSync('reports/coverage.xml', 'utf8');
            const coverageMatch = coverageXml.match(/line-rate="([\d.]+)"/);
            const coverage = coverageMatch ? (parseFloat(coverageMatch[1]) * 100).toFixed(2) : 'N/A';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 CineTrack Test Results\n\n✅ All tests passed!\n📊 Coverage: **${coverage}%**\n\nDetailed reports available in artifacts.`
            });

  # Job adicional para tests de integración (opcional, solo en main)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r tests/requirements.txt
      
      - name: 🔗 Run Integration Tests
        run: |
          python run_cinetrack_tests.py --integration
        continue-on-error: true