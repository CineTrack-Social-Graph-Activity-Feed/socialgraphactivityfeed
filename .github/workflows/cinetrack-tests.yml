name: CineTrack Testing Suite

on:
  push:
    branches: ['main']  # Solo cuando hay commits en main
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
      - name: 📥 Checkout main code
        uses: actions/checkout@v4
        with:
          ref: main  # Código principal
      
      - name: 📥 Checkout tests from tests-only branch
        uses: actions/checkout@v4
        with:
          ref: tests-only  # Branch con los tests
          path: test-suite  # Los coloca en carpeta test-suite/
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-suite/tests/requirements.txt
      
      - name: 🧪 Run Unit Tests with Coverage
        run: |
          cd test-suite
          python run_cinetrack_tests.py --unit --coverage
        continue-on-error: false
      
      - name: 📤 Upload Coverage Reports
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: test-suite/reports/coverage_*/
          retention-days: 30
      
      - name: 📈 Upload Coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          files: ./test-suite/reports/coverage.xml
          flags: unittests
          name: codecov-cinetrack
          fail_ci_if_error: false

