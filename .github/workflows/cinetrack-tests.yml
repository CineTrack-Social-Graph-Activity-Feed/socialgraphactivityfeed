name: CineTrack Testing Suite

on:
  push:
    branches: ['main', 'develop', 'tests-only']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      
      - name: 🧪 Run Unit Tests with Coverage
        run: |
          python run_cinetrack_tests.py --unit --coverage
      
      - name: 📊 Generate Coverage Badge
        run: |
          pip install coverage-badge
          coverage-badge -o coverage.svg -f
      
      - name: 📤 Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            reports/coverage_*/
            coverage.svg
            reports/coverage.xml
          retention-days: 30
          if-no-files-found: warn
      
      - name: 📈 Upload Coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./reports/coverage.xml
          flags: unittests
          name: codecov-cinetrack
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: 💬 Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const coverageXml = fs.readFileSync('reports/coverage.xml', 'utf8');
              const coverageMatch = coverageXml.match(/line-rate="([\d.]+)"/);
              const coverage = coverageMatch ? (parseFloat(coverageMatch[1]) * 100).toFixed(2) : 'N/A';
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🧪 CineTrack Test Results\n\n✅ All tests passed!\n📊 Coverage: **${coverage}%**\n\n📦 Detailed HTML reports available in workflow artifacts.`
              });
            } catch (error) {
              console.log('Could not read coverage file:', error.message);
            }
