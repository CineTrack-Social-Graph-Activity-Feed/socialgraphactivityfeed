name: CineTrack Testing Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-html pytest-asyncio pytest-mock pytest-faker requests Faker python-dotenv
          echo "Core dependencies installed"
      
      - name: 🧪 Run Unit Tests
        run: |
          python -m pytest tests/unit -v --tb=short --junitxml=reports/junit-unit.xml
        continue-on-error: false
      
      - name: 📊 Run Unit Tests with Coverage
        run: |
          python -m pytest tests/unit --cov=tests --cov-report=xml:reports/coverage-unit.xml --cov-report=html:reports/coverage-unit --cov-report=term
        continue-on-error: true
      
      - name: 📤 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/coverage-unit.xml
          flags: unittests
          name: codecov-cinetrack-python-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: 📋 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            reports/
          retention-days: 30
      
      - name: 💬 Test Summary
        if: always()
        run: |
          echo "## 🧪 CineTrack Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ All unit tests executed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Coverage reports available in artifacts" >> $GITHUB_STEP_SUMMARY
