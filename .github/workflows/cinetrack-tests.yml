name: Tests E2E y Integración

on:
  push:
    branches: [ main, terraform-iac ]
    paths:
      - 'tests/**'
      - 'Backend/**'
      - 'Frontend/**'
      - '.github/workflows/cinetrack-tests.yml'
  pull_request:
    branches: [ main, terraform-iac ]
    paths:
      - 'tests/**'
      - 'Backend/**'
      - 'Frontend/**'
      - '.github/workflows/cinetrack-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          echo "✅ Test dependencies installed from tests/requirements.txt"
      
      - name: 📁 Create reports directory
        run: mkdir -p tests/reports reports
      
      - name: 🧪 Run Unit Tests
        run: |
          python -m pytest tests/unit -v --tb=short --junitxml=reports/junit-unit.xml
        continue-on-error: false
      
      - name: 📊 Run Unit Tests with Coverage
        run: |
          python -m pytest tests/unit --cov=tests --cov-report=xml:reports/coverage-unit.xml --cov-report=html:reports/coverage-unit --cov-report=term
        continue-on-error: true
      
      - name: 📤 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./reports/coverage-unit.xml
          flags: unittests
          name: codecov-cinetrack-python-3.11
          fail_ci_if_error: false
      
      - name: 📋 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-3.11
          path: |
            reports/
          retention-days: 30
      
      - name: 💬 Test Summary
        if: always()
        run: |
          echo "## 🧪 CineTrack Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** 3.11" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ All unit tests executed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Coverage reports available in artifacts" >> $GITHUB_STEP_SUMMARY
