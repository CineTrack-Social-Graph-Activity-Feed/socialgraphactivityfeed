name: CI/CD Frontend

on:
  pull_request:
    branches: [ main, terraform-iac ]
  workflow_dispatch:
  push:
    branches: [ main, terraform-iac ]
    paths:
      - 'Frontend/**'

jobs:
  # Get infrastructure outputs (no terraform apply, just read state)
  get-infra-outputs:
    runs-on: ubuntu-latest
    environment: main-aws
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      s3_bucket: ${{ steps.tf-out.outputs.s3_bucket }}
      cloudfront_frontend_id: ${{ steps.tf-out.outputs.cloudfront_frontend_id }}
      cloudfront_backend_url: ${{ steps.tf-out.outputs.cloudfront_backend_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Terraform Init (read-only)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=socialgraph/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Read Terraform Outputs
        id: tf-out
        run: |
          echo "s3_bucket=$(terraform output -raw frontend_s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_frontend_id=$(terraform output -raw cloudfront_frontend_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_backend_url=$(terraform output -raw cloudfront_backend_url)" >> $GITHUB_OUTPUT

  ci:
    runs-on: ubuntu-latest
    needs: get-infra-outputs
    environment: main-aws
    defaults:
      run:
        working-directory: ./Frontend/front-cinetrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/front-cinetrack/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env: 
          # API del backend servida por CloudFront backend
          VITE_API_URL: ${{ secrets.API_URL || needs.get-infra-outputs.outputs.cloudfront_backend_url }}
          VITE_API_BASE_URL: ${{ secrets.API_URL || needs.get-infra-outputs.outputs.cloudfront_backend_url }}
      - name: Verify output directory
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output encontrado en dist/"
            echo "OUTPUT_DIR=dist" >> $GITHUB_ENV
          else
            echo "❌ No se encontró el directorio de salida"
            ls -la
            exit 1
          fi
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/front-cinetrack/${{ env.OUTPUT_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: [get-infra-outputs, ci]
    environment: main-aws
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/terraform-iac') && github.event_name == 'push'
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build-output
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy to S3 with correct content types
        run: |
          echo "🚀 Desplegando a S3 desde build-output/ ..."
          
          # Crear directorios para rutas de SPA
          mkdir -p build-output/api-test
          mkdir -p build-output/mi-actividad
          mkdir -p build-output/follows
          mkdir -p build-output/buscar-amigos
          mkdir -p build-output/debug
          
          # Copiar index.html a cada ruta para soporte de SPA
          cp build-output/index.html build-output/api-test/index.html
          cp build-output/index.html build-output/mi-actividad/index.html
          cp build-output/index.html build-output/follows/index.html
          cp build-output/index.html build-output/buscar-amigos/index.html
          cp build-output/index.html build-output/debug/index.html
          cp build-output/index.html build-output/error.html
          
          # Subir HTML con tipo de contenido específico
          find build-output -name "*.html" -type f -exec aws s3 cp {} s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/{} \
            --content-type "text/html" \
            --cache-control "no-cache" \;
          
          # Subir JS con tipo de contenido específico
          find build-output -name "*.js" -type f -exec aws s3 cp {} s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/{} \
            --content-type "application/javascript" \
            --cache-control "max-age=31536000" \;
          
          # Subir CSS con tipo de contenido específico
          find build-output -name "*.css" -type f -exec aws s3 cp {} s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/{} \
            --content-type "text/css" \
            --cache-control "max-age=31536000" \;
          
          # Subir SVG con tipo de contenido específico
          find build-output -name "*.svg" -type f -exec aws s3 cp {} s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/{} \
            --content-type "image/svg+xml" \
            --cache-control "max-age=31536000" \;
          
          # Subir todo lo demás
          aws s3 sync build-output/ s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }} --delete
      - name: Fix index.html in S3
        run: |
          # Asegurar que index.html tenga el content-type correcto
          aws s3 cp s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/index.html \
              s3://${{ secrets.S3_BUCKET || needs.get-infra-outputs.outputs.s3_bucket }}/index.html \
              --content-type "text/html" \
              --metadata-directive REPLACE \
              --cache-control "no-cache"
      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidando caché de CloudFront..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || needs.get-infra-outputs.outputs.cloudfront_frontend_id }} \
            --paths "/*"
          echo "✅ Despliegue completado!"
